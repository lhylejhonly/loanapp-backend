services:
  - type: web
    name: loan-app-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: loan-app-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: loan-app-backend.onrender.com,loanapp-backend-q0la.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://loan-app-backend.onrender.com,https://loanapp-backend-q0la.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://loan-app-backend.onrender.com,https://loanapp-backend-q0la.onrender.com
      - key: DJANGO_MEDIA_STORAGE
        value: filesystem
      - key: EMAIL_VERIFICATION_PROVIDER
        value: console
      - key: DISBURSEMENT_PROVIDER
        value: manual

databases:
  - name: loan-app-db
    databaseName: loan_app
    user: loan_app_user
    plan: free
