services:
  - type: web
    name: loan-app-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: loan-app-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: loan-app-backend.onrender.com,loanapp-backend-q0la.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://loan-app-backend.onrender.com,https://loanapp-backend-q0la.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://loan-app-backend.onrender.com,https://loanapp-backend-q0la.onrender.com
      - key: DJANGO_MEDIA_STORAGE
        value: filesystem
      - key: EMAIL_VERIFICATION_PROVIDER
        value: brevo
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: a915b0001@smtp-brevo.com
      - key: EMAIL_HOST_PASSWORD
        value: bskkFPfSTkJdH5t
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: DEFAULT_FROM_EMAIL
        value: "loan app <lhylejhonly71@gmail.com>"
      - key: DISBURSEMENT_PROVIDER
        value: manual

databases:
  - name: loan-app-db
    databaseName: loan_app
    user: loan_app_user
    plan: free
